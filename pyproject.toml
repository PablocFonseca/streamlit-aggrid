[project]
name = "streamlit-aggrid"
version = "2.0.0.rc1"
description = "Streamlit component implementation of ag-grid"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Fonseca", email = "pablo.fonseca+pip@gmail.com" }]
keywords = ["streamlit", "ag-grid", "component"]
dependencies = ["streamlit (>=1.59.0)", "pandas >=1.4.0"]

[project.urls]
homepage = "https://github.com/PablocFonseca/streamlit-aggrid"

[tool.poetry]
packages = [{ include = "streamlit_aggrid" }, { include = "st_aggrid" }]

# The frontend sources are not shipped; only the build output is included below
# (source maps are also left out to keep the wheel small).
exclude = ["streamlit_aggrid/frontend"]
include = [
    { path = "streamlit_aggrid/frontend/build/**/*.mjs", format = [
        "sdist",
        "wheel",
    ] },
    { path = "streamlit_aggrid/frontend/build/**/*.css", format = [
        "sdist",
        "wheel",
    ] },
    { path = "streamlit_aggrid/json/**/*.json", format = [
        "sdist",
        "wheel",
    ] },
    { path = "streamlit_aggrid/pyproject.toml", format = [
        "sdist",
        "wheel",
    ] },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/e2e"]
markers = [
    "e2e: needs a browser and a built frontend (run with: pytest -m e2e)",
    "slow: slow tests (performance suites)",
]
addopts = "-m 'not e2e'"

[tool.poetry.group.dev.dependencies]
bs4 = "^0.0.2"
playwright = "^1.51.0"
pytest = "^8.3.5"
pytest-playwright = "^0.7.0"
watchdog = "^6.0.0"
ruff = "*"
streamlit-code-editor = "^0.1.12"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.streamlit.component.components]]
name = "agGrid"
asset_dir = "frontend/build"
